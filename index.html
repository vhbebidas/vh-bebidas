function buildProdutos(){
  PRODUTOS=[];
  CATEGORIAS.forEach(c=>c.itens.forEach(i=>{
    const nome=typeof i==='string'?i:i.nome,pacote=typeof i==='string'?(c.pacote??null):(i.pacote??c.pacote??null);

  }));
  CATALOGO.extras.forEach(x=>{
    const cat=CATEGORIAS.find(c=>c.id===x.catId);
    PRODUTOS.push({id:x.id,catId:x.catId,nome:x.nome,pacote:x.unidadeOnly?null:(x.pacote||null),pacoteEditavel:!x.unidadeOnly,unidadeOnly:!!x.unidadeOnly,quenteGelado:false,cigarro:false,emoji:cat?cat.emoji:'🛍️',custom:true});
  });
  Object.keys(CATALOGO.editados).forEach(id=>{
    const p=PRODUTOS.find(x=>x.id===id);
    if(p){
      const ed=CATALOGO.editados[id];
      if(ed.nome)p.nome=ed.nome;
      if('pacote' in ed)p.pacote=ed.pacote;
      if(ed.catId&&ed.catId!==p.catId){
        p.catId=ed.catId;
        const novaCat=CATEGORIAS.find(c=>c.id===ed.catId);

      }
    }
  });

}

function abrirRecorte(file,onSave){
  const overlay=document.createElement('div');overlay.className='crop-overlay';
  overlay.innerHTML='<div class="crop-frame"><img id="cropImg" alt=""></div><div class="crop-dica">Arraste a foto pra posicionar dentro do quadro · use o controle pra dar zoom. O que aparece no quadro é exatamente como vai ficar salvo.</div><div class="crop-zoom-row"><span>🔍</span><input type="range" id="cropZoom" min="100" max="320" value="100"></div><div class="botoes crop-botoes"><button class="cancelar" id="cropCancelar">Cancelar</button><button class="confirmar" id="cropSalvar">✅ Usar essa foto</button></div>';
  document.body.appendChild(overlay);
  const img=overlay.querySelector('#cropImg'),frame=overlay.querySelector('.crop-frame'),zoomEl=overlay.querySelector('#cropZoom');
  const FRAME=260;
  let naturalW=0,naturalH=0,baseScale=1,scale=1,offX=0,offY=0;

  function clamp(){
    const dw=naturalW*scale,dh=naturalH*scale;
    offX=Math.min(0,Math.max(FRAME-dw,offX));
    offY=Math.min(0,Math.max(FRAME-dh,offY));
  }
  function aplicar(){
    clamp();
    img.style.width=(naturalW*scale)+'px';
    img.style.height=(naturalH*scale)+'px';
    img.style.left=offX+'px';
    img.style.top=offY+'px';
  }

  const reader=new FileReader();
  reader.onload=()=>{
    img.onload=()=>{
      naturalW=img.naturalWidth;naturalH=img.naturalHeight;
      baseScale=Math.max(FRAME/naturalW,FRAME/naturalH);
      scale=baseScale;
      offX=(FRAME-naturalW*scale)/2;
      offY=(FRAME-naturalH*scale)/2;
      aplicar();
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(file);

  zoomEl.oninput=()=>{
    const novoScale=baseScale*(zoomEl.value/100);
    const cx=FRAME/2,cy=FRAME/2;
    const relX=(cx-offX)/scale,relY=(cy-offY)/scale;
    scale=novoScale;
    offX=cx-relX*scale;
    offY=cy-relY*scale;
    aplicar();
  };

  let dragging=false,startX=0,startY=0,startOffX=0,startOffY=0,pid=null;
  frame.addEventListener('pointerdown',ev=>{
    dragging=true;pid=ev.pointerId;try{frame.setPointerCapture(pid)}catch(err){}
    startX=ev.clientX;startY=ev.clientY;startOffX=offX;startOffY=offY;
  });
  frame.addEventListener('pointermove',ev=>{
    if(!dragging)return;
    offX=startOffX+(ev.clientX-startX);
    offY=startOffY+(ev.clientY-startY);
    aplicar();
  });
  const pararDrag=()=>{dragging=false};
  frame.addEventListener('pointerup',pararDrag);
  frame.addEventListener('pointercancel',pararDrag);

  overlay.querySelector('#cropCancelar').onclick=()=>overlay.remove();
  overlay.querySelector('#cropSalvar').onclick=()=>{
    const canvas=document.createElement('canvas');canvas.width=300;canvas.height=300;
    const ctx=canvas.getContext('2d');
    const sx=-offX/scale,sy=-offY/scale,sw=FRAME/scale,sh=FRAME/scale;
    ctx.drawImage(img,sx,sy,sw,sh,0,0,300,300);
    const dataUrl=canvas.toDataURL('image/jpeg',0.87);
    overlay.remove();
    onSave(dataUrl);
  };
}

}
function sincronizarCotacao(){
  migrarCotacaoAntiga();
  let mudou=false;
  const idsComLinha=new Set(COTACAO.linhas.map(l=>l.produtoId));
  PRODUTOS.forEach(p=>{
    if(!idsComLinha.has(p.id)){
      COTACAO.linhas.push({id:'l'+Date.now()+Math.random().toString(36).slice(2),produtoId:p.id,qtd:'',fornecedor:'',preco:''});
      mudou=true;
    }
  });
  if(mudou)salvarCotacao();
}
function abrirCotacao(){

  const btnFechar=document.createElement('button');btnFechar.textContent='✕ Fechar';btnFechar.style.cssText='border:0;background:#f4f4f6;border-radius:12px;padding:10px 14px;font-weight:800;font-size:12px;cursor:pointer;flex:none;min-height:40px';

  btnAdd.onclick=()=>{if(!PRODUTOS.length)return;COTACAO.linhas.unshift({id:'l'+Date.now()+Math.random().toString(36).slice(2),produtoId:PRODUTOS[0].id,qtd:'',fornecedor:'',preco:''});salvarCotacao();renderLista()};

  const resumo=document.createElement('div');resumo.className='cotacao-resumo';
  function atualizarSelectFornecedores(){
    const atual=selForn.value;

    selForn.innerHTML='<option value="">Todos os fornecedores</option>'+nomes.map(n=>'<option value="'+n.replace(/"/g,'&quot;')+'">'+n+'</option>').join('');

  }
  function recalcularResumo(visiveis){
    let total=0;

  }
  function renderLista(){
    atualizarSelectFornecedores();
    body.innerHTML='';
    const buscaTxt=inpBusca.value.trim().toLowerCase(),fornFiltro=selForn.value;
    let linhas=COTACAO.linhas.filter(l=>{
      const p=PRODUTOS.find(x=>x.id===l.produtoId);
      const nomeProd=p?p.nome.toLowerCase():'';
      if(buscaTxt&&!nomeProd.includes(buscaTxt))return false;
      if(fornFiltro&&(l.fornecedor||'').trim()!==fornFiltro)return false;

    });

      const selProd=document.createElement('select');selProd.className='cotacao-select-produto';

      cQtd.appendChild(inpQtd);
      const cForn=document.createElement('div');cForn.className='cotacao-campo';cForn.innerHTML='<label>Fornecedor</label>';
      const inpForn=document.createElement('input');inpForn.type='text';inpForn.placeholder='Nome';inpForn.value=l.fornecedor;
      cForn.appendChild(inpForn);
      const cPreco=document.createElement('div');cPreco.className='cotacao-campo full';cPreco.innerHTML='<label>Preço unitário (R$)</label>';
      const inpPreco=document.createElement('input');inpPreco.type='number';inpPreco.step='0.01';inpPreco.placeholder='0,00';inpPreco.value=l.preco;
      cPreco.appendChild(inpPreco);
      campos.append(cQtd,cForn,cPreco);
      card.appendChild(campos);
      const tdTotal=document.createElement('div');tdTotal.className='cotacao-total-linha';
      function atualizarTotalLinha(){
        const qtd=Number(inpQtd.value)||0,preco=Number(inpPreco.value)||0;
        tdTotal.textContent='Total: '+dinheiro(qtd*preco);
      }
      atualizarTotalLinha();
      card.appendChild(tdTotal);
      inpQtd.oninput=()=>{l.qtd=inpQtd.value;salvarCotacao();atualizarTotalLinha();recalcularResumo(linhas)};
      inpForn.oninput=()=>{l.fornecedor=inpForn.value;salvarCotacao();atualizarSelectFornecedores()};
      inpPreco.oninput=()=>{l.preco=inpPreco.value;salvarCotacao();atualizarTotalLinha();recalcularResumo(linhas)};
      const btnDel=document.createElement('button');btnDel.className='cotacao-del-linha';btnDel.textContent='🗑️ Remover esta linha';
      btnDel.onclick=()=>{COTACAO.linhas=COTACAO.linhas.filter(x=>x.id!==l.id);sincronizarCotacao();salvarCotacao();renderLista()};
      card.appendChild(btnDel);
      body.appendChild(card);
    });
    body.appendChild(resumo);recalcularResumo(linhas);
  }
  selForn.onchange=renderLista;
  inpBusca.oninput=renderLista;
  renderLista();
  document.body.appendChild(bg);
}
function labelModo(item){if(item.modo==='pacote')return'PCT';if(item.modo==='maco')return'MC';if(item.modo!=='fardo')return'UN';const p=PRODUTOS.find(x=>x.id===item.produtoId);return p?rotuloFardo(p):'FD'}
function gerarOrcamentoTexto(o){const l=[];l.push('*ORÇAMENTO*');if(LOJA.nome)l.push(LOJA.nome);if(LOJA.telefone)l.push('Tel: '+LOJA.telefone);l.push('');l.push('Orçamento Nº '+o.numero);l.push(new Date(o.ts).toLocaleDateString('pt-BR')+' '+new Date(o.ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}));l.push('');o.itens.forEach(i=>{l.push(i.nome);l.push('  '+i.qtd+' '+labelModo(i)+' x '+dinheiro(i.preco)+' = '+dinheiro(i.total))});l.push('');l.push('Subtotal: '+dinheiro(o.subtotal));if(o.desconto>0)l.push('Desconto: '+dinheiro(o.desconto));l.push('*Total: '+dinheiro(o.total)+'*');l.push('');if(o.cliente)l.push('Cliente: '+o.cliente);l.push('');l.push('⚠️ Valores sujeitos à confirmação de estoque no momento da compra.');return l.join('\n')}

function gerarCupomTexto(v){const labelPag={dinheiro:'Dinheiro',pix:'PIX',cartao:'Cartão',fiado:'A receber',avista:'À vista'};const l=[];l.push('*CUPOM DE VENDA*');if(LOJA.nome)l.push(LOJA.nome);if(LOJA.endereco)l.push(LOJA.endereco);if(LOJA.cnpj)l.push('CNPJ: '+LOJA.cnpj);if(LOJA.telefone)l.push('Tel: '+LOJA.telefone);l.push('');l.push('Venda Nº '+v.numero);l.push(new Date(v.ts).toLocaleDateString('pt-BR')+' '+new Date(v.ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}));l.push('');v.itens.forEach(i=>{l.push(i.nome);l.push('  '+i.qtd+' '+labelModo(i)+' x '+dinheiro(i.preco)+' = '+dinheiro(i.total))});l.push('');l.push('Subtotal: '+dinheiro(v.subtotal));if(v.desconto>0)l.push('Desconto: '+dinheiro(v.desconto));l.push('*Total Geral: '+dinheiro(v.total)+'*');l.push('');if(v.cliente)l.push('Cliente: '+v.cliente);l.push('Pagamento: '+(labelPag[v.pagamento]||v.pagamento));if(v.pagamento==='fiado'){const valorPago=v.valorPago||0;if(v.pago){l.push('Status: QUITADO ✅')}else if(valorPago>0){l.push('Já pago: '+dinheiro(valorPago));l.push('Falta pagar: '+dinheiro(v.total-valorPago))}else{l.push('Status: EM ABERTO')}}return l.join('\n')}
function copiarTexto(t){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>toast('Texto copiado! Cole no WhatsApp.')).catch(()=>copiarTextoFallback(t))}else{copiarTextoFallback(t)}}
function copiarTextoFallback(t){try{const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;top:-1000px;left:-1000px;opacity:0';document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,999999);const ok=document.execCommand('copy');document.body.removeChild(ta);ok?toast('Texto copiado! Cole no WhatsApp.'):toast('Não consegui copiar — mantém o dedo apertado no texto do cupom pra copiar manualmente.')}catch(e){toast('Não consegui copiar — mantém o dedo apertado no texto do cupom pra copiar manualmente.')}}
async function compartilharImagem(el,nomeArquivo,legenda){
  if(typeof html2canvas==='undefined'){toast('Sem internet pra gerar a imagem agora — usa o WhatsApp com texto.');return}
  toast('Gerando imagem...');
  try{
    const canvas=await html2canvas(el,{backgroundColor:'#ffffff',scale:2,useCORS:true});
    canvas.toBlob(async blob=>{
      if(!blob){toast('Não consegui gerar a imagem.');return}
      const file=new File([blob],nomeArquivo,{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        try{await navigator.share({files:[file],title:legenda,text:legenda})}catch(e){}
      }else{
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a');a.href=url;a.download=nomeArquivo;
        document.body.appendChild(a);a.click();document.body.removeChild(a);
        URL.revokeObjectURL(url);
        toast('Esse navegador não abre o WhatsApp direto — a imagem foi baixada, é só anexar.');
      }
    },'image/png');
  }catch(e){toast('Não consegui gerar a imagem.')}
}
function abrirCupom(v){
  const m=baseModal('🧾 Cupom de venda','Tire um print do quadro abaixo pra enviar, ou use os botões.');
  const box=document.createElement('div');
  box.className='cupom-print';
  const head=document.createElement('div');
  head.className='cupom-head';
  head.innerHTML='<img class="cupom-logo" src="'+LOGO_CUPOM+'" alt="Logo">'+
    '<div class="titulo-cupom">CUPOM DE VENDA</div>'+
    (LOJA.nome?'<div class="loja-nome">'+LOJA.nome+'</div>':'')+
    (LOJA.endereco?'<div class="loja-info">'+LOJA.endereco+'</div>':'')+
    ((LOJA.cnpj||LOJA.telefone)?'<div class="loja-info">'+(LOJA.cnpj?'CNPJ: '+LOJA.cnpj:'')+(LOJA.cnpj&&LOJA.telefone?' · ':'')+(LOJA.telefone?'Tel: '+LOJA.telefone:'')+'</div>':'');
  box.appendChild(head);

  const corpo=document.createElement('div');
  corpo.className='cupom-body';
  const linhas=[];
  linhas.push('Venda Nº '+v.numero+'   '+new Date(v.ts).toLocaleDateString('pt-BR')+' '+new Date(v.ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}));
  linhas.push('─'.repeat(28));
  v.itens.forEach(i=>{
    linhas.push(i.nome);
    linhas.push('  '+i.qtd+' '+labelModo(i)+' x '+dinheiro(i.preco)+'  =  '+dinheiro(i.total));
  });
  linhas.push('─'.repeat(28));
  linhas.push('Subtotal:'.padEnd(18)+dinheiro(v.subtotal));
  if(v.desconto>0)linhas.push('Desconto:'.padEnd(18)+'-'+dinheiro(v.desconto));
  linhas.push('');
  linhas.push('TOTAL GERAL:  '+dinheiro(v.total));
  linhas.push('');
  if(v.cliente)linhas.push('Cliente: '+v.cliente);
  const labelPag={dinheiro:'Dinheiro',pix:'PIX',cartao:'Cartão',fiado:'A receber',avista:'À vista'};
  linhas.push('Pagamento: '+(labelPag[v.pagamento]||v.pagamento));
  if(v.pagamento==='fiado'){
    const valorPago=v.valorPago||0;
    if(v.pago){
      linhas.push('Status: QUITADO ✅');
    }else if(valorPago>0){
      linhas.push('Já pago: '+dinheiro(valorPago));
      linhas.push('Falta pagar: '+dinheiro(v.total-valorPago));
    }else{
      linhas.push('Status: EM ABERTO');
    }
  }
  corpo.textContent=linhas.join('\n');
  box.appendChild(corpo);

  const foot=document.createElement('div');
  foot.className='cupom-foot';
  foot.textContent='Obrigado pela preferência! 🍻';
  box.appendChild(foot);

  m.appendChild(box);

  const btnImg=document.createElement('button');
  btnImg.textContent='📷 Enviar imagem no WhatsApp';
  btnImg.style.cssText='width:100%;padding:13px;border:0;border-radius:10px;background:var(--verde);color:#fff;font-weight:800;font-size:14px;margin-bottom:10px';
  btnImg.onclick=()=>compartilharImagem(box,'cupom_venda_'+v.numero+'.png','Cupom de venda Nº '+v.numero);
  m.appendChild(btnImg);

  const dicaSel=document.createElement('p');
  dicaSel.style.cssText='font-size:11px;color:#9a917d;margin:-6px 0 12px;text-align:center';
  dicaSel.textContent='Ou toque e segure o texto abaixo pra selecionar e copiar direto.';
  m.appendChild(dicaSel);

  if(v.pagamento==='fiado'&&!v.pago){
    const aviso=document.createElement('p');
    aviso.style.cssText='font-size:11.5px;color:var(--vermelho);margin:-4px 0 12px';
    aviso.textContent='🧾 Venda fiada — lembra de marcar como pago no menu "💰 Fiado" quando o cliente pagar.';
    m.appendChild(aviso);
  }

  const bs=document.createElement('div');
  bs.className='botoes';
  bs.style.marginBottom='8px';
  bs.innerHTML='<button class="cancelar">📋 Copiar texto</button><button class="confirmar">📤 WhatsApp</button>';
  bs.firstChild.onclick=()=>copiarTexto(gerarCupomTexto(v));
  bs.lastChild.onclick=()=>{
    const texto=encodeURIComponent(gerarCupomTexto(v));
    if(navigator.share){navigator.share({text:gerarCupomTexto(v),title:'Cupom de venda'}).catch(()=>{})}
    else{window.open('https://wa.me/?text='+texto,'_blank')}
  };
  m.appendChild(bs);

  const fechar=document.createElement('button');
  fechar.textContent='Fechar';

function registrarPagamentoParcial(id){
  const v=VENDAS.find(x=>x.id===id);if(!v)return;
  const restante=v.total-(v.valorPago||0);
  const m=baseModal('💵 Registrar pagamento','Venda Nº'+(v.numero??'')+' · '+(v.cliente||'Cliente não informado')+'. Total: '+dinheiro(v.total)+(v.valorPago>0?' · já pago: '+dinheiro(v.valorPago):'')+'. Falta: '+dinheiro(restante)+'. Se o cliente só tá pagando parte, é só colocar o valor que ele pagou agora.');
  const inp=document.createElement('input');inp.className='campo';inp.type='number';inp.step='0.01';inp.placeholder='Valor pago agora';inp.value=restante.toFixed(2);
  m.appendChild(inp);
  const bs=document.createElement('div');bs.className='botoes';
  bs.innerHTML='<button class="cancelar">Cancelar</button><button class="confirmar">Confirmar pagamento</button>';
  bs.firstChild.onclick=()=>abrirFiados();
  bs.lastChild.onclick=()=>{
    const valor=Number(inp.value);
    if(!valor||valor<=0)return toast('Informa um valor válido');
    if(valor>restante+0.009)return toast('Esse valor é maior que o que falta ('+dinheiro(restante)+')');
    v.valorPago=(v.valorPago||0)+valor;
    if(v.valorPago>=v.total-0.009){v.pago=true;v.valorPago=v.total;toast('Pago totalmente! 🎉')}
    else toast('Pagamento parcial registrado — ainda falta '+dinheiro(v.total-v.valorPago));
    salvar();abrirFiados();
  };
  m.appendChild(bs);
}
function marcarPago(id){const v=VENDAS.find(x=>x.id===id);if(!v)return;v.pago=true;v.valorPago=v.total;salvar();fecharModal();abrirFiados();toast('Marcado como pago')}
function desmarcarPago(id){const v=VENDAS.find(x=>x.id===id);if(!v)return;v.pago=false;v.valorPago=0;salvar();fecharModal();abrirFiados();toast('Venda voltou pra fiado pendente')}
function paraCSV(vendas){
  const linhas=[['Data','Nº Venda','Hora','Produto','Qtd','Preço Unit.','Total Item','Cliente','Pagamento','Status']];
  vendas.forEach(v=>{
    v.itens.forEach(i=>{
      linhas.push([v.data,v.numero??'',new Date(v.ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),i.nome,i.qtd,(i.preco||0).toFixed(2),(i.total||0).toFixed(2),v.cliente||'',v.pagamento==='fiado'?'Fiado':'À vista',v.pagamento==='fiado'?(v.pago?'Pago':'Em aberto'):'-']);
    });
  });
  return linhas.map(l=>l.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\r\n');
}
function exportarCSV(vendas,nomeArquivo){
  if(!vendas.length)return toast('Não há vendas nesse período pra exportar');
  const csv='\uFEFF'+paraCSV(vendas);
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=nomeArquivo;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Planilha baixada');
}
function imprimirRelatorio(vendas,titulo){

    });

  const w=window.open('','_blank');
  if(!w){toast('Permite pop-ups nesse navegador pra gerar o PDF');return}
  w.document.write(html);w.document.close();
  setTimeout(()=>{w.print()},350);
}
function isoDia(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function barrasPorDia(vendasPeriodo,diasArray){
  const porDia={};diasArray.forEach(d=>porDia[d]=0);
  vendasPeriodo.forEach(v=>porDia[v.data]=(porDia[v.data]||0)+v.total);
  const max=Math.max(1,...Object.values(porDia));
  const wrap=document.createElement('div');wrap.style.cssText='margin:12px 0 4px;max-height:260px;overflow:auto';
  diasArray.forEach(d=>{
    const val=porDia[d]||0;
    const row=document.createElement('div');row.style.cssText='display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:11px';
    const label=document.createElement('div');label.style.cssText='width:40px;flex:none;color:#7a7264';
    label.textContent=new Date(d+'T00:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
    const track=document.createElement('div');track.style.cssText='flex:1;background:var(--creme2);border-radius:5px;overflow:hidden;height:16px';
    const bar=document.createElement('div');const pct=val>0?Math.max(4,Math.round(val/max*100)):0;
    bar.style.cssText='height:100%;background:var(--amarelo);width:'+pct+'%;border-radius:5px';
    track.appendChild(bar);
    const valLabel=document.createElement('div');valLabel.style.cssText='width:76px;flex:none;text-align:right;font-weight:700';
    valLabel.textContent=val>0?dinheiro(val):'—';
    row.append(label,track,valLabel);wrap.appendChild(row);
  });
  return wrap;
}
function abrirResumoPeriodo(){
  let modo='7d',dataDe=isoDia(new Date()),dataAte=isoDia(new Date());
  function calcularRange(){
    const h=new Date();let de,ate=new Date(h);
    if(modo==='7d'){de=new Date(h);de.setDate(de.getDate()-6)}
    else if(modo==='30d'){de=new Date(h);de.setDate(de.getDate()-29)}
    else if(modo==='mes'){de=new Date(h.getFullYear(),h.getMonth(),1)}
    else{de=new Date(dataDe+'T00:00:00');ate=new Date(dataAte+'T00:00:00')}
    return{de,ate};
  }
  function montar(){
    const{de,ate}=calcularRange();
    const diasArray=[];const cursor=new Date(de);
    while(cursor<=ate){diasArray.push(isoDia(cursor));cursor.setDate(cursor.getDate()+1)}
    const deISO=isoDia(de),ateISO=isoDia(ate);
    const vendasPeriodo=VENDAS.filter(v=>v.data>=deISO&&v.data<=ateISO);
    const totalPeriodo=vendasPeriodo.reduce((s,v)=>s+v.total,0);
    const m=baseModal('📊 Resumo de vendas','Acompanhe o total vendido por período.');
    const ops=document.createElement('div');ops.className='opcoes';
    [['7d','7 dias'],['30d','30 dias'],['mes','Este mês'],['personalizado','Personalizado']].forEach(([v,l])=>{
      const b=document.createElement('button');b.className='opcao'+(modo===v?' ativa':'');b.textContent=l;b.onclick=()=>{modo=v;montar()};ops.appendChild(b);
    });
    m.appendChild(ops);
    if(modo==='personalizado'){
      const wrap=document.createElement('div');wrap.style.cssText='display:flex;gap:8px;margin-bottom:10px';
      const de1=document.createElement('input');de1.type='date';de1.className='campo';de1.value=dataDe;
      const ate1=document.createElement('input');ate1.type='date';ate1.className='campo';ate1.value=dataAte;
      de1.onchange=()=>{dataDe=de1.value;montar()};ate1.onchange=()=>{dataAte=ate1.value;montar()};
      wrap.append(de1,ate1);m.appendChild(wrap);
    }
    const box=document.createElement('div');box.className='totalbox';
    box.innerHTML='<small>TOTAL NO PERÍODO</small><br><b>'+dinheiro(totalPeriodo)+'</b><div style="font-size:11px;margin-top:4px;color:#bdb6a4">'+vendasPeriodo.length+' venda'+(vendasPeriodo.length!==1?'s':'')+'</div>';
    m.appendChild(box);
    m.appendChild(barrasPorDia(vendasPeriodo,diasArray));
    const porProduto={};
    vendasPeriodo.forEach(v=>v.itens.forEach(i=>{
      const chave=i.produtoId||i.comboId||i.id;
      if(!porProduto[chave])porProduto[chave]={nome:i.nome,produtoId:i.produtoId,qtd:0,porModo:{}};
      const pp=porProduto[chave];
      pp.qtd+=i.qtd;
      const modo=i.isCombo?'combo':(i.modo||'unidade');
      pp.porModo[modo]=(pp.porModo[modo]||0)+i.qtd;
    }));
    function rotuloModo(produtoId,modo,qtd){
      const p=PRODUTOS.find(x=>x.id===produtoId);
      if(modo==='combo')return qtd+' kit'+(qtd!==1?'s':'');
      if(p&&p.cigarro){
        if(modo==='pacote')return qtd+' pac.';
        if(modo==='maco')return qtd+' maço'+(qtd!==1?'s':'');
        return qtd+' un.';
      }
      if(modo==='fardo')return qtd+' '+(p?rotuloFardo(p):'FD');
      return qtd+' un.';
    }
    const ranking=Object.values(porProduto).sort((a,b)=>b.qtd-a.qtd).slice(0,8);
    if(ranking.length){
      const tit=document.createElement('div');tit.style.cssText='font-size:12px;font-weight:800;text-transform:uppercase;color:#7a7264;margin:14px 0 8px;border-bottom:2px solid var(--amarelo);padding-bottom:4px';tit.textContent='🏆 Mais vendidos no período';
      m.appendChild(tit);
      ranking.forEach((item,idx)=>{
        const l=document.createElement('div');l.style.cssText='display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #ece2cc;font-size:12.5px;gap:8px';
        const medalha=idx===0?'🥇':idx===1?'🥈':idx===2?'🥉':(idx+1)+'.';
        const detalhe=Object.entries(item.porModo).map(([modo,qtd])=>rotuloModo(item.produtoId,modo,qtd)).join(' + ');
        l.innerHTML='<span>'+medalha+' '+item.nome+'</span><b style="text-align:right;white-space:nowrap">'+detalhe+'</b>';
        m.appendChild(l);
      });
    }
    const bsExport=document.createElement('div');bsExport.className='botoes';bsExport.style.marginTop='14px';
    bsExport.innerHTML='<button class="cancelar">📄 Planilha (CSV)</button><button class="confirmar">🖨️ PDF / Imprimir</button>';
    bsExport.firstChild.onclick=()=>exportarCSV(vendasPeriodo,'vendas_'+deISO+'_a_'+ateISO+'.csv');
    bsExport.lastChild.onclick=()=>imprimirRelatorio(vendasPeriodo,'Vendas de '+new Date(deISO+'T00:00:00').toLocaleDateString('pt-BR')+' a '+new Date(ateISO+'T00:00:00').toLocaleDateString('pt-BR'));
    m.appendChild(bsExport);
  }
  montar();
}

function editarDataVenda(id,dataAtual){

  m.appendChild(inp);
  const bs=document.createElement('div');bs.className='botoes';

    if(!novaData)return toast('Escolhe uma data');

function exportarBackup(){
  salvar();salvarLoja();salvarClientes();salvarCombos();salvarCaixaTudo();salvarDiasFechados();salvarFavoritos();
  const dados={};
  CHAVES_BACKUP.forEach(k=>{const v=localStorage.getItem(k);if(v!==null)dados[k]=JSON.parse(v)});
  const pacote={app:'vh-bebidas',versao:1,exportadoEm:new Date().toISOString(),dados};
  const blob=new Blob([JSON.stringify(pacote)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='backup-vh-bebidas-'+hoje()+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Backup baixado');
}
function restaurarBackup(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const pacote=JSON.parse(reader.result);
      if(!pacote||!pacote.dados)throw new Error('formato inválido');
      if(!confirm('Isso vai SUBSTITUIR tudo que está salvo agora (estoque, preços, vendas, clientes, fotos) pelo conteúdo desse backup de '+(pacote.exportadoEm?new Date(pacote.exportadoEm).toLocaleString('pt-BR'):'data desconhecida')+'. Quer continuar?'))return;
      CHAVES_BACKUP.forEach(k=>{if(k in pacote.dados)localStorage.setItem(k,JSON.stringify(pacote.dados[k]))});
      toast('Backup restaurado! Recarregando...');
      setTimeout(()=>location.reload(),900);
    }catch(err){toast('Esse arquivo não parece um backup válido do app')}
  };
  reader.readAsText(file);
}

function gerarFlyerEl(ocasiao,textoCustom,produto,dadosProduto,fundoCustom){

  if(fundoCustom){
    div.style.background="url('"+fundoCustom+"') center/cover no-repeat, linear-gradient(160deg,"+ocasiao.bg[0]+","+ocasiao.bg[1]+")";
    div.classList.add('flyer-tem-fundo-custom');
  } else {
    div.style.background='linear-gradient(160deg,'+ocasiao.bg[0]+','+ocasiao.bg[1]+')';
  }
  const titulo=ocasiao.id==='personalizado'?textoCustom:(ocasiao.emoji+' '+ocasiao.label);
  const faixaTxt=(dadosProduto&&dadosProduto.modoPreco==='promo')?'🔥 OFERTA IMPERDÍVEL':('✨ '+(LOJA.nome||'VH Bebidas'));
  let html='<div class="flyer-faixa">'+faixaTxt+'</div><div class="flyer-topo">'+titulo+'</div>';
  if(produto&&dadosProduto){
    const e=estado(produto);
    const foto=fotoAtual(produto,e);
    let precoHtml='';
    if(dadosProduto.modoPreco==='promo'){
      precoHtml='<div class="flyer-promo"><span class="flyer-promo-num">'+dadosProduto.promoQtd+'</span><span class="flyer-promo-por">POR</span><span class="flyer-promo-preco">'+dadosProduto.promoPreco+'</span></div>';
    } else if(dadosProduto.precoTexto){
      precoHtml='<div class="flyer-preco">'+dadosProduto.precoTexto+'</div>';
    }
    html+='<div class="flyer-produto">'+
      '<div class="flyer-foto-wrap"><div class="flyer-foto-glow"></div>'+
      (foto?'<div class="flyer-foto" style="background-image:url(\''+foto+'\')"></div>':'<div class="flyer-foto" style="display:grid;place-items:center;font-size:60px">'+produto.emoji+'</div>')+
      '</div>'+
      '<div class="flyer-nome">'+dadosProduto.nome+'</div>'+
      precoHtml+
      '</div>';
  } else {
    html+='<div class="flyer-produto"><img src="'+LOGO_CUPOM+'" style="width:190px;filter:drop-shadow(0 10px 20px rgba(0,0,0,.35))"></div>';
  }
  html+='<div class="flyer-rodape"><img src="'+LOGO_CUPOM+'" class="flyer-logo" alt="Logo"><div class="flyer-loja"><b>'+(LOJA.nome||'VH Bebidas')+'</b>'+
    '<div>📱 '+LOJA.telefone+'</div>'+
    '<div>📍 '+LOJA.endereco+'</div>'+
    '</div></div>';
  div.innerHTML=html;
  return div;
}

function vendasDoCaixa(){return CAIXA.aberto?VENDAS.filter(v=>v.ts>=CAIXA.ts):[]}

function abrirTelaCaixa(){
  if(!CAIXA.aberto){
    const m=baseModal('💵 Abrir caixa','Informe quanto tem de dinheiro físico no caixa agora.');

    btn.onclick=()=>{CAIXA={aberto:true,ts:Date.now(),dataAbertura:hoje(),valorInicial:Number(inp.value)||0,movimentos:[]};salvarCaixaTudo();fecharModal();toast('Caixa aberto');abrirTelaCaixa()};
    m.append(inp,btn);return;
  }
  const vendas=vendasDoCaixa(),soma=somaPorPagamento(vendas);
  const sangrias=CAIXA.movimentos.filter(x=>x.tipo==='sangria').reduce((s,x)=>s+x.valor,0);
  const reforcos=CAIXA.movimentos.filter(x=>x.tipo==='reforco').reduce((s,x)=>s+x.valor,0);

  resumo2.innerHTML='💵 Dinheiro (vendas): '+dinheiro(soma.dinheiro)+'<br>📱 PIX: '+dinheiro(soma.pix)+'<br>💳 Cartão: '+dinheiro(soma.cartao)+'<br>🧾 Fiado: '+dinheiro(soma.fiado)+'<br>➕ Reforços: '+dinheiro(reforcos)+'<br>➖ Sangrias: '+dinheiro(sangrias)+'<br>Valor inicial: '+dinheiro(CAIXA.valorInicial);
  m.appendChild(resumo2);
  if(CAIXA.movimentos.length){
    const titMov=document.createElement('div');titMov.style.cssText='font-size:11px;font-weight:800;text-transform:uppercase;color:#7a7264;margin-bottom:6px';titMov.textContent='Movimentações';

      const l=document.createElement('div');l.style.cssText='display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px solid #ece2cc';
      l.innerHTML='<span>'+(mv.tipo==='sangria'?'➖':'➕')+' '+mv.motivo+'</span><b>'+dinheiro(mv.valor)+'</b>';
      m.appendChild(l);
    });
  }
  const bsMov=document.createElement('div');bsMov.className='botoes';bsMov.style.margin='12px 0';
  bsMov.innerHTML='<button class="cancelar">➖ Sangria</button><button class="confirmar" style="background:var(--verde);color:#fff">➕ Reforço</button>';
  bsMov.firstChild.onclick=()=>abrirMovimentoCaixa('sangria');
  bsMov.lastChild.onclick=()=>abrirMovimentoCaixa('reforco');
  m.appendChild(bsMov);
  const btnFechar=document.createElement('button');btnFechar.textContent='🔒 Fechar caixa';btnFechar.style.cssText='width:100%;padding:12px;border:0;border-radius:10px;background:var(--vermelhobg);color:var(--vermelho);font-weight:800;font-size:14px';
  btnFechar.onclick=()=>abrirFecharCaixa(saldoDinheiro,soma);

function abrirMovimentoCaixa(tipo){

function abrirFecharCaixa(saldoEsperado,soma){
  const m=baseModal('🔒 Fechar caixa','Conta o dinheiro físico que está no caixa agora e confirma.');

  bs.lastChild.onclick=()=>{
    const contado=Number(inpContado.value);
    if(inpContado.value===''||isNaN(contado))return toast('Digita o valor contado');
    const diferenca=contado-saldoEsperado;

const PALAVRAS_IGNORAR=new Set(['de','da','do','das','dos','un','unidade','unidades','fardo','fardos','caixa','caixas','pacote','pacotes','pac','cx','maco','macos','maco','varejo','solto','soltas','avulsa','avulso','vendi','vendemos','e','tambem','mais','so']);
const NUM_PALAVRAS={zero:0,um:1,uma:1,dois:2,duas:2,tres:3,quatro:4,cinco:5,seis:6,sete:7,oito:8,nove:9,dez:10,onze:11,doze:12,treze:13,quatorze:14,catorze:14,quinze:15,dezesseis:16,dezessete:17,dezoito:18,dezenove:19,vinte:20,trinta:30,quarenta:40,cinquenta:50,sessenta:60,setenta:70,oitenta:80,noventa:90,cem:100,cento:100};
const DEZENAS_PALAVRAS={vinte:20,trinta:30,quarenta:40,cinquenta:50,sessenta:60,setenta:70,oitenta:80,noventa:90};
function normalizarTexto(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function palavrasParaNumeros(texto){
  let t=normalizarTexto(texto);
  t=t.replace(/\b(vinte|trinta|quarenta|cinquenta|sessenta|setenta|oitenta|noventa)\s+e\s+(um|uma|dois|duas|tres|quatro|cinco|seis|sete|oito|nove)\b/g,(m,a,b)=>String(DEZENAS_PALAVRAS[a]+NUM_PALAVRAS[b]));
  t=t.replace(/\b([a-z]+)\b/g,w=>(w in NUM_PALAVRAS)?String(NUM_PALAVRAS[w]):w);
  return t;
}
function segmentarVenda(texto){
  const t=palavrasParaNumeros(texto);
  const matches=[...t.matchAll(/(\d+)\s*([^\d]*)/g)];
  return matches.map(m=>({qtd:parseInt(m[1]),desc:m[2].trim()})).filter(x=>x.qtd>0);
}
function melhorProduto(desc){
  const palavrasDesc=normalizarTexto(desc).split(/\s+/).filter(w=>w&&!PALAVRAS_IGNORAR.has(w));
  let melhor=null,melhorScore=0;
  PRODUTOS.forEach(p=>{
    const palavrasNome=normalizarTexto(p.nome).split(/[\s\/]+/).filter(w=>w&&!PALAVRAS_IGNORAR.has(w));
    let score=0;
    palavrasNome.forEach(pn=>{if(palavrasDesc.some(pd=>pd===pn||(pn.length>3&&pd.startsWith(pn))||(pd.length>3&&pn.startsWith(pd))))score++});
    if(score>melhorScore){melhorScore=score;melhor=p}
  });
  return melhorScore>0?melhor:null;
}
function detectarModoVoz(desc,p){
  const d=normalizarTexto(desc);
  if(p.cigarro){
    if(/pacote|\bpac\b/.test(d))return'pacote';
    if(/maco/.test(d))return'maco';
    return'varejo';
  }
  if(p.unidadeOnly||!p.pacote)return'unidade';
  if(/fardo|caixa|\bcx\b|\bpac\b/.test(d))return'fardo';
  return'unidade';
}
function parseVendaVoz(texto){
  const segmentos=segmentarVenda(texto),itens=[];
  segmentos.forEach(seg=>{
    const p=melhorProduto(seg.desc);
    if(!p)return;
    const e=estado(p),modo=detectarModoVoz(seg.desc,p);
    let fator,preco;
    if(p.cigarro){fator=modo==='pacote'?200:modo==='maco'?20:1;preco=modo==='pacote'?(e.precoFardo||0):modo==='maco'?(e.precoMaco||0):(e.precoUnidade||0)}
    else if(modo==='fardo'){fator=e.pacote||1;preco=e.precoFardo||e.precoGelado||e.precoQuente||0}
    else{fator=1;preco=e.precoUnidade||0}
    itens.push({id:Date.now()+Math.random(),produtoId:p.id,nome:p.nome,qtd:seg.qtd,modo,temperatura:null,fator,preco,total:seg.qtd*preco});
  });
  return itens;
}

      const card=document.createElement('div');card.className='cotacao-card';
      const topo=document.createElement('div');topo.style.cssText='display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px';
      topo.innerHTML='<div style="font-weight:800;font-size:13.5px">'+p.nome+'</div>';
      card.appendChild(topo);
      const linhaConfig=document.createElement('div');linhaConfig.style.cssText='display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px';
      const campoCusto=document.createElement('div');campoCusto.style.cssText='display:flex;align-items:center;gap:6px';
      campoCusto.innerHTML='<span style="font-size:11px;color:#9a9aa0">💰 Custo</span>';
      const inpCusto=document.createElement('input');inpCusto.type='number';inpCusto.step='0.01';inpCusto.value=e.custoUltimaCompra??'';inpCusto.style.cssText='width:64px;border:1px solid #e4e4e7;border-radius:8px;padding:5px 6px;font-size:12px;background:#fafafa';
      inpCusto.oninput=()=>{e.custoUltimaCompra=inpCusto.value?Number(inpCusto.value):null;autoSalvar();renderLista()};
      campoCusto.appendChild(inpCusto);
      const campoMeta=document.createElement('div');campoMeta.style.cssText='display:flex;align-items:center;gap:6px';
      campoMeta.innerHTML='<span style="font-size:11px;color:#9a9aa0">🎯 Meta desse produto</span>';
      const inpMeta=document.createElement('input');inpMeta.type='number';inpMeta.placeholder=String(MARGEM_ALVO);inpMeta.value=e.margemAlvo??'';inpMeta.style.cssText='width:50px;border:1px solid #e4e4e7;border-radius:8px;padding:5px 6px;font-size:12px;background:#fafafa';
      inpMeta.oninput=()=>{e.margemAlvo=inpMeta.value===''?null:Number(inpMeta.value);autoSalvar();renderLista()};
      campoMeta.appendChild(inpMeta);
      const spanPct2=document.createElement('span');spanPct2.style.cssText='font-size:11px;color:#9a9aa0';spanPct2.textContent='%';
      campoMeta.appendChild(spanPct2);
      linhaConfig.append(campoCusto,campoMeta);
      card.appendChild(linhaConfig);
      margens.linhas.forEach(l=>{
        const linha=document.createElement('div');linha.className='margem-linha';
        const topoL=document.createElement('div');topoL.className='margem-topo';
        topoL.innerHTML='<span>'+l.label+'</span><span style="color:'+corPct(l.pct,meta)+'">'+dinheiro(l.lucro)+' <small>('+l.pct.toFixed(1)+'%)</small></span>';
        linha.appendChild(topoL);
        const sub=document.createElement('div');sub.className='margem-sub';sub.textContent='Vende '+dinheiro(l.preco)+' · custou '+dinheiro(l.custo);
        linha.appendChild(sub);
        const barWrap=document.createElement('div');barWrap.className='margem-bar-wrap';
        const bar=document.createElement('div');bar.className='margem-bar';bar.style.width=Math.max(Math.min((l.pct/(meta*1.5||1))*100,100),3)+'%';bar.style.background=corPct(l.pct,meta);
        barWrap.appendChild(bar);linha.appendChild(barWrap);
        if(l.pct<meta){
          const sug=document.createElement('div');sug.className='margem-sugestao';sug.style.color=corPct(l.pct,meta);
          sug.textContent='💡 Pra bater '+meta+'%, sugestão: '+dinheiro(l.custo*(1+meta/100));
          linha.appendChild(sug);
        }
        card.appendChild(linha);
      });
      body.appendChild(card);
    });
    if(semCusto.length){
      const tit2=document.createElement('div');tit2.style.cssText='font-size:12px;font-weight:800;text-transform:uppercase;color:#7a7264;margin:16px 0 8px;border-bottom:2px solid var(--amarelo);padding-bottom:4px';tit2.textContent='Sem custo cadastrado ('+semCusto.length+')';
      body.appendChild(tit2);
      semCusto.forEach(({p,e})=>{
        const card=document.createElement('div');card.className='cotacao-card';card.style.cssText='display:flex;align-items:center;justify-content:space-between;gap:8px';
        const nome=document.createElement('div');nome.style.cssText='font-weight:700;font-size:12.5px;flex:1;min-width:0';nome.textContent=p.nome;
        const inpCusto=document.createElement('input');inpCusto.type='number';inpCusto.step='0.01';inpCusto.placeholder='Custo R$';inpCusto.style.cssText='width:80px;border:1px solid #e4e4e7;border-radius:8px;padding:7px 8px;font-size:12px;background:#fafafa';
        inpCusto.oninput=()=>{e.custoUltimaCompra=inpCusto.value?Number(inpCusto.value):null;autoSalvar();renderLista()};
        card.append(nome,inpCusto);
        body.appendChild(card);
      });
    }
    body.appendChild(resumo);recalcularResumo(comCusto);
  }
  inpBusca.oninput=renderLista;
  renderLista();
  document.body.appendChild(bg);
}

function precoExibicaoLinhas(p,e){
  const linhas=[];
  if(p.cigarro){
    if(e.precoFardo)linhas.push(dinheiro(e.precoFardo)+' pacote');
    if(e.precoMaco)linhas.push(dinheiro(e.precoMaco)+' maço');
    if(e.precoUnidade)linhas.push(dinheiro(e.precoUnidade)+' un.');
  } else if(p.unidadeOnly){
    if(e.precoUnidade)linhas.push(dinheiro(e.precoUnidade));
  } else {
    if(p.quenteGelado){
      if(e.precoGelado)linhas.push('🧊 '+dinheiro(e.precoGelado));
      if(e.precoQuente)linhas.push('🔥 '+dinheiro(e.precoQuente));
    } else if(e.precoFardo){
      linhas.push(dinheiro(e.precoFardo)+(e.pacote?' /'+rotuloFardo(p):''));
    }
    if(e.precoUnidade)linhas.push(dinheiro(e.precoUnidade)+' un.');
  }
  return linhas.length?linhas:['Consulte o preço'];
}
function precoExibicao(p,e){return precoExibicaoLinhas(p,e).join(' · ')}
function precoExibicaoLinhasCatalogo(p,e){
  const linhas=precoExibicaoLinhas(p,e);
  if(p.unidadeOnly)return linhas;
  const semUnidade=linhas.filter(l=>!l.endsWith(' un.'));
  return semUnidade.length?semUnidade:['Consulte o preço'];
}
function cardCatalogo(p){
  const e=estado(p);
  const d=document.createElement('div');d.className='card item';d.style.padding='16px';d.dataset.nome=p.nome.toLowerCase();
  const topo=document.createElement('div');topo.className='cat-top';
  const foto=document.createElement('div');foto.className='foto';foto.style.cssText='width:98px;height:98px;flex:none';
  const fotoMostrar2=fotoAtual(p,e);foto.innerHTML=fotoMostrar2?'<div class="foto-img" style="background-image:url(\''+fotoMostrar2+'\')"></div>':'<span>'+p.emoji+'</span>';
  const corpo=document.createElement('div');corpo.className='cat-corpo';
  const nome=document.createElement('div');nome.className='cat-nome';nome.textContent=p.nome;
  const linhasPreco=precoExibicaoLinhasCatalogo(p,e);
  const precos=document.createElement('div');precos.className='cat-precos';precos.innerHTML=linhasPreco.join('<br>');
  corpo.append(nome,precos);
  if(p.promo){
    const promo=document.createElement('div');promo.className='cat-promo';
    promo.innerHTML='🎉 Promoção: '+p.promo.qtd+' un. por '+dinheiro(p.promo.preco);
    corpo.appendChild(promo);
  }
  topo.append(foto,corpo);
  d.append(topo);return d;
}
function renderCatalogoPublico(){
  document.getElementById('cartFab').classList.add('hide');
  document.getElementById('btnMenu').classList.add('hide');
  document.querySelector('header .top .logo').innerHTML='<img src="'+LOGO_CUPOM+'" class="logo-img" alt="VH Bebidas"><small style="color:#9a9aa0;font-weight:700;font-size:11px;margin-left:6px">Catálogo</small>';
  const main=document.getElementById('main'),chips=document.getElementById('chips');
  main.innerHTML='';chips.innerHTML='';
  CATEGORIAS.forEach(c=>{
    const itensCat=PRODUTOS.filter(p=>p.catId===c.id&&!estado(p).pausado&&!p.cigarro&&p.id!=='diversos--picole-palito');if(!itensCat.length)return;
    const ch=document.createElement('button');ch.className='chip';ch.textContent=c.emoji+' '+tituloCategoria(c);ch.onclick=()=>document.getElementById('cat-'+c.id).scrollIntoView({behavior:'smooth'});chips.appendChild(ch);
    const sec=document.createElement('section');sec.className='categoria';sec.id='cat-'+c.id;
    sec.innerHTML='<div class="titulo">'+c.emoji+' '+tituloCategoria(c)+'</div>';
    itensCat.forEach(p=>sec.appendChild(cardCatalogo(p)));
    main.appendChild(sec);
  });
  const fab=document.createElement('button');fab.className='carrinho-fab';fab.style.background='#2f8a4b';fab.textContent='📲 Pedir pelo WhatsApp';
  fab.onclick=()=>{const tel=(LOJA.telefone||'').replace(/\D/g,'');const msg=encodeURIComponent('Olá! Vi o catálogo da '+(LOJA.nome||'loja')+' e quero fazer um pedido.');window.open('https://wa.me/'+(tel?('55'+tel):'')+'?text='+msg,'_blank')};
  document.body.appendChild(fab);
}
function abrirLinkCatalogo(){
  const link=location.href.split('#')[0]+'#catalogo';
  const m=baseModal('🔗 Catálogo online','Envie esse link pro cliente. Ele abre uma lista com fotos e preços, sem poder editar nada do seu estoque.');
  const box=document.createElement('div');box.style.cssText='background:var(--creme2);padding:12px;border-radius:10px;font-size:12px;word-break:break-all;margin-bottom:12px';box.textContent=link;m.appendChild(box);
  const aviso=document.createElement('p');aviso.style.cssText='font-size:11px;color:#9a917d;margin:-4px 0 12px';aviso.textContent='Esse link só funciona se o endereço do app for sempre o mesmo (hospedagem fixa, tipo GitHub Pages).';m.appendChild(aviso);
  const bs=document.createElement('div');bs.className='botoes';bs.innerHTML='<button class="cancelar">📋 Copiar link</button><button class="confirmar">📤 WhatsApp</button>';
  bs.firstChild.onclick=()=>copiarTexto(link);
  bs.lastChild.onclick=()=>{const msg=encodeURIComponent('Confira nosso catálogo de produtos: '+link);if(navigator.share){navigator.share({text:'Confira nosso catálogo: '+link}).catch(()=>{})}else{window.open('https://wa.me/?text='+msg,'_blank')}};
  m.appendChild(bs);
}

if(location.hash==='#catalogo'){renderCatalogoPublico()}else{document.querySelector('.logo').innerHTML='<img src="'+LOGO_CUPOM+'" class="logo-img" alt="VH Bebidas">';render()}
