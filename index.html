function gerarCupomTexto(v){const labelPag={dinheiro:'Dinheiro',pix:'PIX',cartao:'Cartão',fiado:'A receber',avista:'À vista'};const l=[];l.push('*CUPOM DE VENDA*');if(LOJA.nome)l.push(LOJA.nome);if(LOJA.endereco)l.push(LOJA.endereco);if(LOJA.cnpj)l.push('CNPJ: '+LOJA.cnpj);if(LOJA.telefone)l.push('Tel: '+LOJA.telefone);l.push('');l.push('Venda Nº '+v.numero);l.push(new Date(v.ts).toLocaleDateString('pt-BR')+' '+new Date(v.ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}));l.push('');v.itens.forEach(i=>{l.push(i.nome);l.push('  '+i.qtd+' UN x '+dinheiro(i.preco)+' = '+dinheiro(i.total))});l.push('');l.push('Subtotal: '+dinheiro(v.subtotal));if(v.desconto>0)l.push('Desconto: '+dinheiro(v.desconto));l.push('*Total Geral: '+dinheiro(v.total)+'*');l.push('');if(v.cliente)l.push('Cliente: '+v.cliente);l.push('Pagamento: '+(labelPag[v.pagamento]||v.pagamento));return l.join('\n')}
function copiarTexto(t){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>toast('Texto copiado! Cole no WhatsApp.')).catch(()=>copiarTextoFallback(t))}else{copiarTextoFallback(t)}}
function copiarTextoFallback(t){try{const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;top:-1000px;left:-1000px;opacity:0';document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,999999);const ok=document.execCommand('copy');document.body.removeChild(ta);ok?toast('Texto copiado! Cole no WhatsApp.'):toast('Não consegui copiar — mantém o dedo apertado no texto do cupom pra copiar manualmente.')}catch(e){toast('Não consegui copiar — mantém o dedo apertado no texto do cupom pra copiar manualmente.')}}
async function compartilharImagem(el,nomeArquivo,legenda){
  if(typeof html2canvas==='undefined'){toast('Sem internet pra gerar a imagem agora — usa o WhatsApp com texto.');return}
  toast('Gerando imagem...');
  try{
    const canvas=await html2canvas(el,{backgroundColor:'#ffffff',scale:2,useCORS:true});
    canvas.toBlob(async blob=>{
      if(!blob){toast('Não consegui gerar a imagem.');return}
      const file=new File([blob],nomeArquivo,{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        try{await navigator.share({files:[file],title:legenda,text:legenda})}catch(e){}
      }else{
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a');a.href=url;a.download=nomeArquivo;
        document.body.appendChild(a);a.click();document.body.removeChild(a);
        URL.revokeObjectURL(url);
        toast('Esse navegador não abre o WhatsApp direto — a imagem foi baixada, é só anexar.');
      }
    },'image/png');
  }catch(e){toast('Não consegui gerar a imagem.')}
}
function abrirCupom(v){
  const m=baseModal('🧾 Cupom de venda','Tire um print do quadro abaixo pra enviar, ou use os botões.');
  const box=document.createElement('div');
  box.className='cupom-print';
  const head=document.createElement('div');
  head.className='cupom-head';
  head.innerHTML='<img class="cupom-logo" src="'+LOGO_CUPOM+'" alt="Logo">'+
    '<div class="titulo-cupom">CUPOM DE VENDA</div>'+
    (LOJA.nome?'<div class="loja-nome">'+LOJA.nome+'</div>':'')+
    (LOJA.endereco?'<div class="loja-info">'+LOJA.endereco+'</div>':'')+
    ((LOJA.cnpj||LOJA.telefone)?'<div class="loja-info">'+(LOJA.cnpj?'CNPJ: '+LOJA.cnpj:'')+(LOJA.cnpj&&LOJA.telefone?' · ':'')+(LOJA.telefone?'Tel: '+LOJA.telefone:'')+'</div>':'');
  box.appendChild(head);

  const corpo=document.createElement('div');
  corpo.className='cupom-body';
  const linhas=[];
  linhas.push('Venda Nº '+v.numero+'   '+new Date(v.ts).toLocaleDateString('pt-BR')+' '+new Date(v.ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}));
  linhas.push('─'.repeat(28));
  v.itens.forEach(i=>{
    linhas.push(i.nome);
    linhas.push('  '+i.qtd+' UN x '+dinheiro(i.preco)+'  =  '+dinheiro(i.total));
  });
  linhas.push('─'.repeat(28));
  linhas.push('Subtotal:'.padEnd(18)+dinheiro(v.subtotal));
  if(v.desconto>0)linhas.push('Desconto:'.padEnd(18)+'-'+dinheiro(v.desconto));
  linhas.push('');
  linhas.push('TOTAL GERAL:  '+dinheiro(v.total));
  linhas.push('');
  if(v.cliente)linhas.push('Cliente: '+v.cliente);
  const labelPag={dinheiro:'Dinheiro',pix:'PIX',cartao:'Cartão',fiado:'A receber',avista:'À vista'};
  linhas.push('Pagamento: '+(labelPag[v.pagamento]||v.pagamento));
  corpo.textContent=linhas.join('\n');
  box.appendChild(corpo);

  const foot=document.createElement('div');
  foot.className='cupom-foot';
  foot.textContent='Obrigado pela preferência! 🍻';
  box.appendChild(foot);

  m.appendChild(box);

  const btnImg=document.createElement('button');
  btnImg.textContent='📷 Enviar imagem no WhatsApp';
  btnImg.style.cssText='width:100%;padding:13px;border:0;border-radius:10px;background:var(--verde);color:#fff;font-weight:800;font-size:14px;margin-bottom:10px';
  btnImg.onclick=()=>compartilharImagem(box,'cupom_venda_'+v.numero+'.png','Cupom de venda Nº '+v.numero);
  m.appendChild(btnImg);

  const dicaSel=document.createElement('p');
  dicaSel.style.cssText='font-size:11px;color:#9a917d;margin:-6px 0 12px;text-align:center';
  dicaSel.textContent='Ou toque e segure o texto abaixo pra selecionar e copiar direto.';
  m.appendChild(dicaSel);

  if(v.pagamento==='fiado'&&!v.pago){
    const aviso=document.createElement('p');
    aviso.style.cssText='font-size:11.5px;color:var(--vermelho);margin:-4px 0 12px';
    aviso.textContent='🧾 Venda fiada — lembra de marcar como pago no menu "💰 Fiado" quando o cliente pagar.';
    m.appendChild(aviso);
  }

  const bs=document.createElement('div');
  bs.className='botoes';
  bs.style.marginBottom='8px';
  bs.innerHTML='<button class="cancelar">📋 Copiar texto</button><button class="confirmar">📤 WhatsApp</button>';
  bs.firstChild.onclick=()=>copiarTexto(gerarCupomTexto(v));
  bs.lastChild.onclick=()=>{
    const texto=encodeURIComponent(gerarCupomTexto(v));
    if(navigator.share){navigator.share({text:gerarCupomTexto(v),title:'Cupom de venda'}).catch(()=>{})}
    else{window.open('https://wa.me/?text='+texto,'_blank')}
  };
  m.appendChild(bs);

  const fechar=document.createElement('button');
  fechar.textContent='Fechar';
  fechar.style.cssText='width:100%;padding:11px;border:0;border-radius:10px;background:var(--creme2);color:#756c5e;font-weight:800';
  fechar.onclick=fecharModal;
  m.appendChild(fechar);
}

function abrirResumoPeriodo(){
  let modo='7d',dataDe=isoDia(new Date()),dataAte=isoDia(new Date());

    const h=new Date();let de,ate=new Date(h);
    if(modo==='7d'){de=new Date(h);de.setDate(de.getDate()-6)}

  }
  function montar(){
    const{de,ate}=calcularRange();

    while(cursor<=ate){diasArray.push(isoDia(cursor));cursor.setDate(cursor.getDate()+1)}

    const vendasPeriodo=VENDAS.filter(v=>v.data>=deISO&&v.data<=ateISO);
    const totalPeriodo=vendasPeriodo.reduce((s,v)=>s+v.total,0);

      const wrap=document.createElement('div');wrap.style.cssText='display:flex;gap:8px;margin-bottom:10px';
      const de1=document.createElement('input');de1.type='date';de1.className='campo';de1.value=dataDe;
      const ate1=document.createElement('input');ate1.type='date';ate1.className='campo';ate1.value=dataAte;

    const box=document.createElement('div');box.className='totalbox';

    m.appendChild(box);
    m.appendChild(barrasPorDia(vendasPeriodo,diasArray));
    const porProduto={};
    vendasPeriodo.forEach(v=>v.itens.forEach(i=>{if(!porProduto[i.produtoId])porProduto[i.produtoId]={nome:i.nome,qtd:0};porProduto[i.produtoId].qtd+=i.qtd}));
    const ranking=Object.values(porProduto).sort((a,b)=>b.qtd-a.qtd).slice(0,8);
    if(ranking.length){
      const tit=document.createElement('div');tit.style.cssText='font-size:12px;font-weight:800;text-transform:uppercase;color:#7a7264;margin:14px 0 8px;border-bottom:2px solid var(--amarelo);padding-bottom:4px';tit.textContent='🏆 Mais vendidos no período';
      m.appendChild(tit);

        l.innerHTML='<span>'+medalha+' '+item.nome+'</span><b>'+item.qtd+' un.</b>';
        m.appendChild(l);
      });
    }
    const bsExport=document.createElement('div');bsExport.className='botoes';bsExport.style.marginTop='14px';
    bsExport.innerHTML='<button class="cancelar">📄 Planilha (CSV)</button><button class="confirmar">🖨️ PDF / Imprimir</button>';
    bsExport.firstChild.onclick=()=>exportarCSV(vendasPeriodo,'vendas_'+deISO+'_a_'+ateISO+'.csv');
    bsExport.lastChild.onclick=()=>imprimirRelatorio(vendasPeriodo,'Vendas de '+new Date(deISO+'T00:00:00').toLocaleDateString('pt-BR')+' a '+new Date(ateISO+'T00:00:00').toLocaleDateString('pt-BR'));
    m.appendChild(bsExport);
  }
  montar();
}

margin-bottom:8px;font-size:13px';CATEGORIAS.forEach(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=c.emoji+' '+c.titulo;selCat.appendChild(o)});const inpNome=document.createElement('input');inpNome.placeholder='Nome do produto';inpNome.className='campo';const inpPacote=document.createElement('input');inpPacote.type='number';inpPacote.placeholder='Unidades por fardo/caixa (deixe em branco se não tiver)';inpPacote.className='campo';const lblUn=document.createElement('label');lblUn.style.cssText='display:flex;align-items:center;gap:6px;font-size:12.5px;margin-bottom:10px';const chkUn=document.createElement('input');chkUn.type='checkbox';lblUn.append(chkUn,document.createTextNode('Controlado só por unidade (sem fardo/caixa) — ex: destilado, vinho'));chkUn.onchange=()=>{inpPacote.disabled=chkUn.checked;inpPacote.style.opacity=chkUn.checked?'.4':'1'};const btnAdd=document.createElement('button');btnAdd.textContent='Adicionar produto';btnAdd.style.cssText='width:100%;padding:12px;border:0;border-radius:10px;background:var(--preto);color:var(--amarelo);font-weight:800;font-size:14px';btnAdd.onclick=()=>{const nome=inpNome.value.trim();if(!nome)return toast('Digita o nome do produto');const catId=selCat.value;let id=catId+'--'+slug(nome);if(PRODUTOS.find(x=>x.id===id))id=id+'-'+Date.now();CATALOGO.extras.push({id,catId,nome,pacote:chkUn.checked?null:(Number(inpPacote.value)||null),unidadeOnly:chkUn.checked});salvarCatalogo();buildProdutos();render();fecharModal();toast('Produto adicionado')};novo.append(selCat,inpNome,inpPacote,lblUn,btnAdd);m.appendChild(novo)}
function abrirDadosLoja(){const m=baseModal('🏪 Dados da loja','Essas informações aparecem no topo dos cupons de venda.');const campos=[['Nome da loja','nome'],['Endereço','endereco'],['CNPJ','cnpj'],['Telefone','telefone']];campos.forEach(([label,key])=>{const l=document.createElement('div');l.style.cssText='font-size:11px;color:#7a7264;margin-bottom:3px;font-weight:700';l.textContent=label;const i=document.createElement('input');i.className='campo';i.value=LOJA[key]||'';i.oninput=()=>{LOJA[key]=i.value;salvarLoja()};m.append(l,i)});const l2=document.createElement('div');l2.style.cssText='font-size:11px;color:#7a7264;margin-bottom:3px;font-weight:700;margin-top:6px';l2.textContent='Próximo número de venda';const inpNum=document.createElement('input');inpNum.className='campo';inpNum.type='number';inpNum.value=PROX_VENDA;inpNum.oninput=()=>{PROX_VENDA=Number(inpNum.value)||1;salvar()};m.append(l2,inpNum);const fechar=document.createElement('button');fechar.textContent='Pronto';fechar.style.cssText='width:100%;padding:12px;border:0;border-radius:10px;background:var(--preto);color:var(--amarelo);font-weight:800;font-size:14px;margin-top:10px';fechar.onclick=fecharModal;m.appendChild(fechar)}

ente';const inpTel=document.createElement('input');inpTel.className='campo';inpTel.placeholder='Telefone (opcional)';const inpEnd=document.createElement('input');inpEnd.className='campo';inpEnd.placeholder='Endereço (opcional)';const inpRef=document.createElement('input');inpRef.className='campo';inpRef.placeholder='Ponto de referência (opcional)';const btnAdd=document.createElement('button');btnAdd.textContent='Cadastrar cliente';btnAdd.style.cssText='width:100%;padding:12px;border:0;border-radius:10px;background:var(--preto);color:var(--amarelo);font-weight:800;font-size:14px';btnAdd.onclick=()=>{const nome=inpNome.value.trim();if(!nome)return toast('Digita o nome do cliente');const cli={id:Date.now()+Math.random(),nome,telefone:inpTel.value.trim(),endereco:inpEnd.value.trim(),referencia:inpRef.value.trim()};CLIENTES.push(cli);salvarClientes();toast('Cliente cadastrado');if(callback){callback(cli);fecharModal()}else{fecharModal();abrirClientes()}};novo.append(inpNome,inpTel,inpEnd,inpRef,btnAdd);m.appendChild(novo)}
function vendasDoCaixa(){return CAIXA.aberto?VENDAS.filter(v=>v.ts>=CAIXA.ts):[]}
function somaPorPagamento(vendas){const s={dinheiro:0,pix:0,cartao:0,fiado:0};vendas.forEach(v=>{s[v.pagamento]=(s[v.pagamento]||0)+v.total});return s}
function abrirTelaCaixa(){
  if(!CAIXA.aberto){
    const m=baseModal('💵 Abrir caixa','Informe quanto tem de dinheiro físico no caixa agora.');
    const inp=document.createElement('input');inp.className='campo';inp.type='number';inp.step='0.01';inp.placeholder='Valor inicial em dinheiro R$';
    const btn=document.createElement('button');btn.textContent='Abrir caixa';btn.style.cssText='width:100%;padding:12px;border:0;border-radius:10px;background:var(--preto);color:var(--amarelo);font-weight:800;font-size:14px';
    btn.onclick=()=>{CAIXA={aberto:true,ts:Date.now(),dataAbertura:hoje(),valorInicial:Number(inp.value)||0,movimentos:[]};salvarCaixaTudo();fecharModal();toast('Caixa aberto');abrirTelaCaixa()};
    m.append(inp,btn);return;
  }
  const vendas=vendasDoCaixa(),soma=somaPorPagamento(vendas);
  const sangrias=CAIXA.movimentos.filter(x=>x.tipo==='sangria').reduce((s,x)=>s+x.valor,0);
  const reforcos=CAIXA.movimentos.filter(x=>x.tipo==='reforco').reduce((s,x)=>s+x.valor,0);
  const saldoDinheiro=CAIXA.valorInicial+soma.dinheiro+reforcos-sangrias;
  const m=baseModal('💵 Caixa aberto','Aberto em '+new Date(CAIXA.ts).toLocaleString('pt-BR'));
  const box=document.createElement('div');box.className='totalbox';
  box.innerHTML='<small>DINHEIRO ESPERADO EM CAIXA</small><br><b>'+dinheiro(saldoDinheiro)+'</b>';
  m.appendChild(box);
  const resumo2=document.createElement('div');resumo2.style.cssText='font-size:12.5px;margin-bottom:12px;line-height:1.8';
  resumo2.innerHTML='💵 Dinheiro (vendas): '+dinheiro(soma.dinheiro)+'<br>📱 PIX: '+dinheiro(soma.pix)+'<br>💳 Cartão: '+dinheiro(soma.cartao)+'<br>🧾 Fiado: '+dinheiro(soma.fiado)+'<br>➕ Reforços: '+dinheiro(reforcos)+'<br>➖ Sangrias: '+dinheiro(sangrias)+'<br>Valor inicial: '+dinheiro(CAIXA.valorInicial);
  m.appendChild(resumo2);
  if(CAIXA.movimentos.length){
    const titMov=document.createElement('div');titMov.style.cssText='font-size:11px;font-weight:800;text-transform:uppercase;color:#7a7264;margin-bottom:6px';titMov.textContent='Movimentações';
    m.appendChild(titMov);
    CAIXA.movimentos.slice().reverse().forEach(mv=>{
      const l=document.createElement('div');l.style.cssText='display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px solid #ece2cc';
      l.innerHTML='<span>'+(mv.tipo==='sangria'?'➖':'➕')+' '+mv.motivo+'</span><b>'+dinheiro(mv.valor)+'</b>';
      m.appendChild(l);
    });
  }
  const bsMov=document.createElement('div');bsMov.className='botoes';bsMov.style.margin='12px 0';
  bsMov.innerHTML='<button class="cancelar">➖ Sangria</button><button class="confirmar" style="background:var(--verde);color:#fff">➕ Reforço</button>';
  bsMov.firstChild.onclick=()=>abrirMovimentoCaixa('sangria');
  bsMov.lastChild.onclick=()=>abrirMovimentoCaixa('reforco');
  m.appendChild(bsMov);
  const btnFechar=document.createElement('button');btnFechar.textContent='🔒 Fechar caixa';btnFechar.style.cssText='width:100%;padding:12px;border:0;border-radius:10px;background:var(--vermelhobg);color:var(--vermelho);font-weight:800;font-size:14px';
  btnFechar.onclick=()=>abrirFecharCaixa(saldoDinheiro,soma);
  m.appendChild(btnFechar);
}
function abrirMovimentoCaixa(tipo){
  const m=baseModal(tipo==='sangria'?'➖ Sangria (retirar dinheiro)':'➕ Reforço (colocar dinheiro)','Registra a movimentação de dinheiro físico no caixa.');
  const inpValor=document.createElement('input');inpValor.className='campo';inpValor.type='number';inpValor.step='0.01';inpValor.placeholder='Valor R$';
  const inpMotivo=document.createElement('input');inpMotivo.className='campo';inpMotivo.placeholder='Motivo (ex: troco, retirada, pagamento fornecedor)';
  const bs=document.createElement('div');bs.className='botoes';bs.innerHTML='<button class="cancelar">Cancelar</button><button class="confirmar">Registrar</button>';
  bs.firstChild.onclick=()=>abrirTelaCaixa();
  bs.lastChild.onclick=()=>{
    const valor=Number(inpValor.value);
    if(!valor||valor<=0)return toast('Digita um valor válido');
    CAIXA.movimentos.push({id:Date.now(),tipo,valor,motivo:inpMotivo.value.trim()||(tipo==='sangria'?'Sangria':'Reforço'),ts:Date.now()});
    salvarCaixaTudo();toast(tipo==='sangria'?'Sangria registrada':'Reforço registrado');abrirTelaCaixa();
  };
  m.append(inpValor,inpMotivo,bs);
}
function abrirFecharCaixa(saldoEsperado,soma){
  const m=baseModal('🔒 Fechar caixa','Conta o dinheiro físico que está no caixa agora e confirma.');
  const box=document.createElement('div');box.className='totalbox';box.innerHTML='<small>ESPERADO EM DINHEIRO</small><br><b>'+dinheiro(saldoEsperado)+'</b>';m.appendChild(box);
  const inpContado=document.createElement('input');inpContado.className='campo';inpContado.type='number';inpContado.step='0.01';inpContado.placeholder='Dinheiro contado R$';
  m.appendChild(inpContado);
  const bs=document.createElement('div');bs.className='botoes';bs.innerHTML='<button class="cancelar">Cancelar</button><button class="confirmar">Confirmar fechamento</button>';
  bs.firstChild.onclick=()=>abrirTelaCaixa();
  bs.lastChild.onclick=()=>{
    const contado=Number(inpContado.value);
    if(inpContado.value===''||isNaN(contado))return toast('Digita o valor contado');
    const diferenca=contado-saldoEsperado;
    CAIXA_HIST.push({dataAbertura:CAIXA.dataAbertura,dataFechamento:hoje(),tsAbertura:CAIXA.ts,tsFechamento:Date.now(),valorInicial:CAIXA.valorInicial,vendasDinheiro:soma.dinheiro,vendasPix:soma.pix,vendasCartao:soma.cartao,vendasFiado:soma.fiado,movimentos:CAIXA.movimentos,saldoEsperado,valorContado:contado,diferenca});
    CAIXA={aberto:false};
    salvarCaixaTudo();fecharModal();
    toast(diferenca===0?'Caixa fechado — bateu certinho!':'Caixa fechado — diferença de '+dinheiro(Math.abs(diferenca))+(diferenca<0?' a menos':' a mais'));
  };
  m.appendChild(bs);
}

function atualizarBadgeMenu(){
  const baixoCount=PRODUTOS.filter(p=>{const e=estado(p);return e.minimo>0&&(p.cigarro?Math.floor(e.cigarros/200):e.qtd)<=e.minimo}).length;

function precoExibicao(p,e){
  if(p.cigarro)return e.precoUnidade?dinheiro(e.precoUnidade)+' a unidade':'Consulte o preço';
  if(p.unidadeOnly)return e.precoUnidade?dinheiro(e.precoUnidade):'Consulte o preço';
  if(p.quenteGelado&&(e.precoGelado||e.precoQuente)){const partes=[];if(e.precoGelado)partes.push(dinheiro(e.precoGelado)+' gelada');if(e.precoQuente)partes.push(dinheiro(e.precoQuente)+' quente');return partes.join(' / ')}
  if(e.precoFardo)return dinheiro(e.precoFardo)+(e.pacote?' (caixa/fardo c/ '+e.pacote+')':'');
  if(e.precoUnidade)return dinheiro(e.precoUnidade)+' a unidade';
  return 'Consulte o preço';
}
function cardCatalogo(p){
  const e=estado(p);

  const corpo=document.createElement('div');corpo.className='corpo';
  corpo.innerHTML='<div class="nome">'+p.nome+'</div><div class="obs" style="font-weight:800;color:var(--preto);font-size:13px;margin-top:5px">'+precoExibicao(p,e)+'</div>';
  d.append(foto,corpo);return d;
}
